name: CI

# Phase 11 (`PROJECT_SPEC.md` §33, `PHASE_11_PROMPT.md` §4): runs the full
# backend/ML/frontend test suites plus the frontend production build on
# every push and pull request. No deployment steps here — that's Phase 12
# (`docs/DEPLOYMENT.md`).

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend + ML tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # `backend/requirements.txt` pulls in `ml/requirements.txt` via `-r
      # ../ml/requirements.txt` (`docs/BACKEND_SPEC.md` §1), so one install
      # covers both suites below.
      - name: Install backend + ML dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest tests/backend -q

      - name: Run ML tests
        run: python -m pytest tests/ml -q

  frontend:
    name: Frontend tests + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci

      - name: Production build
        run: npm run build
